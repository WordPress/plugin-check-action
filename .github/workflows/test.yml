name: 'test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
    - main
    - 'releases/*'

permissions:
    contents: write
    pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

  check-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild dist/
        run: |
          npm run build
          npm run package

      - name: Compare the expected and actual dist/ directories
        id: diff
        continue-on-error: true
        run: |
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build. Run 'npm run all' and commit dist/. See status below:"
            git diff --ignore-space-at-eol --text dist/
            exit 1
          fi

      # If dist/ was different than expected, upload the expected version as an artifact.
      - name: Upload expected dist/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.diff.outcome == 'failure' }}
        with:
          name: dist
          path: dist/

      - name: Fail job if dist/ differs
        if: ${{ steps.diff.outcome == 'failure' }}
        run: exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run plugin check (default)
        uses: ./
        continue-on-error: true # Since we expect it to always fail for the test plugin.
        with:
          build-dir: 'tests/fixtures/hello-dolly-copy'

      - name: Run plugin check (exclude checks)
        uses: ./
        continue-on-error: true # Since we expect it to always fail for the test plugin.
        with:
          build-dir: 'tests/fixtures/hello-dolly-copy'
          exclude-checks: |
            late_escaping
            plugin_readme
          include-experimental: true

      - name: Run plugin check (trunk)
        uses: ./
        continue-on-error: true # Since we expect it to always fail for the test plugin.
        with:
          build-dir: 'tests/fixtures/hello-dolly-copy'
          wp-version: 'trunk'

      - name: Run plugin check (plugin dependencies)
        uses: ./
        continue-on-error: true # Since we expect it to always fail for the test plugin.
        with:
          build-dir: 'tests/fixtures/plugin-with-dependencies'

      - name: Run plugin check (strict)
        uses: ./
        continue-on-error: true # Since we expect it to always fail for the test plugin.
        with:
          build-dir: 'tests/fixtures/plugin-with-dependencies'
          ignore-errors: true
          strict: true

      - name: Run plugin check (with comment)
        uses: ./
        continue-on-error: true # Since we expect it to always fail for the test plugin.
        with:
          build-dir: 'tests/fixtures/hello-dolly-copy'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  # Runs on its own because the config below applies to the whole workspace,
  # and because wp-env keeps its state between steps of the same job.
  wp-env-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # wp-env reads its config from the workspace root, which is where a
      # plugin's own .wp-env.json ends up when build-dir points elsewhere.
      - name: Use the config the test plugin ships
        run: cp tests/fixtures/plugin-with-wp-env-config/.wp-env.json .wp-env.json

      - name: Run plugin check (existing wp-env config)
        uses: ./
        continue-on-error: true # Since we expect it to always fail for the test plugin.
        with:
          build-dir: 'tests/fixtures/plugin-with-wp-env-config'

      - name: Verify the config survived
        run: |
          echo "::group::Merged .wp-env.json"
          cat .wp-env.json
          echo "::endgroup::"

          node -e '
            const assert = require( "node:assert" );
            const fs = require( "fs" );

            const config = JSON.parse( fs.readFileSync( ".wp-env.json", "utf8" ) );

            assert.deepStrictEqual( config.config, {
              PLUGIN_CHECK_ACTION_TEST: "preserved",
              WP_DEBUG_DISPLAY: false,
            }, "the config the plugin provided was not kept" );

            assert.ok(
              config.mappings[ "wp-content/plugins/plugin-with-wp-env-config" ]
                ?.endsWith( "/tests/fixtures/plugin-with-wp-env-config" ),
              "the plugin was not mapped into the environment"
            );

            assert.strictEqual( config.port, 8880, "the default port was not filled in" );
            assert.strictEqual( config.testsPort, 8881, "the default tests port was not filled in" );
          '

          # The constant only reaches WordPress if wp-env read the merged config.
          wp-env run cli wp config get PLUGIN_CHECK_ACTION_TEST | grep -q preserved
        shell: bash
